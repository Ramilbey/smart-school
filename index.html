<!doctype html>
<html lang="uz" data-theme="shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <meta name="description" content="Smart Schools: an AI-supported school platform prototype. Gamified Grade 4 fractions and interactive Grade 7 graphs, in Uzbek and Russian." />
    <title>Smart Schools</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="/fonts/Onest-normal-300-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Unbounded-normal-300-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Official Telegram Mini Apps SDK. The app also runs in a normal browser without it. -->
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
    <style>
      html, body { margin: 0; background: #050914; color: #eef2ff; font-family: Onest, system-ui, sans-serif; }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .boot-inner { display: grid; gap: 14px; justify-items: center; max-width: 340px; }
      .boot-title { font-family: Unbounded, system-ui, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; }
      .boot-spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(238,242,255,.15); border-top-color: #2de2c4; animation: s 0.9s linear infinite; }
      .boot-msg { font-size: 14px; line-height: 1.5; color: rgba(238,242,255,.78); }
      .boot-btn { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 12px; border: 0; background: #2de2c4; color: #05221c; cursor: pointer; }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-inner">
          <svg width="56" height="56" viewBox="-130 -130 260 260" aria-hidden="true">
            <path d="M12.5 -89.1 A90 90 0 0 1 89.1 -12.5" stroke="#2DE2C4" stroke-width="24" fill="none" stroke-linecap="round" />
            <path d="M89.1 12.5 A90 90 0 0 1 12.5 89.1" stroke="#5B8CFF" stroke-width="24" fill="none" stroke-linecap="round" />
            <path d="M-12.5 89.1 A90 90 0 0 1 -89.1 12.5" stroke="#FF6B5B" stroke-width="24" fill="none" stroke-linecap="round" />
            <path d="M-89.1 -12.5 A90 90 0 0 1 -12.5 -89.1" stroke="#FFB547" stroke-width="24" fill="none" stroke-linecap="round" />
            <circle r="20" fill="#EEF2FF" />
          </svg>
          <div class="boot-title">Smart Schools</div>
          <div class="boot-spin" id="boot-spin"></div>
          <div class="boot-msg" id="boot-msg"></div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot"><p class="boot-msg">Smart Schools needs JavaScript. · Smart Schools uchun JavaScript kerak. · Для Smart Schools нужен JavaScript.</p></div>
    </noscript>
    <script>
      // If the app bundle cannot load (bad network, server down), explain it instead of a blank screen.
      (function () {
        function fail() {
          if (window.__ssMounted) return;
          var spin = document.getElementById('boot-spin');
          var msg = document.getElementById('boot-msg');
          if (!msg) return;
          if (spin) spin.style.display = 'none';
          msg.innerHTML =
            'Ilova yuklanmadi. Internetni tekshirib, qayta urinib ko‘ring.<br>' +
            'Приложение не загрузилось. Проверьте интернет и попробуйте снова.<br>' +
            'The app could not load. Check your connection and try again.<br><br>' +
            '<button class="boot-btn" onclick="location.reload()">↻ Qayta · Повторить · Retry</button>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') && e.target.src !== undefined && String(e.target.src).indexOf('telegram.org') === -1) fail();
        }, true);
        setTimeout(fail, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
